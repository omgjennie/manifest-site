<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifest — The World's Fastest Digital Whiteboard</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #fdfbf7;
    background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: 'Patrick Hand', cursive;
    color: #2d2d2d;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; position: relative; z-index: 10;
  }

  .logo-wrap { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 40px; height: 40px; background: #fff;
    border: 3px solid #2d2d2d;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 3px 3px 0px 0px #2d2d2d;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: 'Kalam', cursive; font-weight: 700;
    font-size: 20px; color: #2d2d2d; letter-spacing: -0.5px;
  }

  .nav-tag {
    font-family: 'Patrick Hand', cursive; font-size: 12px;
    background: #fff9c4; border: 2px solid #2d2d2d;
    border-radius: 12px 3px 10px 3px / 3px 10px 3px 12px;
    padding: 3px 10px; box-shadow: 2px 2px 0px #2d2d2d;
    color: #2d2d2d; transform: rotate(1.5deg); display: inline-block;
    white-space: nowrap;
  }

  /* HERO */
  .hero {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px 16px 32px; text-align: center;
    position: relative; max-width: 760px; margin: 0 auto;
  }

  /* WHITEBOARD */
  .whiteboard-frame {
    position: relative; width: 100%; max-width: 620px;
    margin: 0 auto 28px; transform: rotate(-1deg);
  }

  .whiteboard-outer {
    background: #fff; border: 3px solid #2d2d2d;
    border-radius: 18px 8px 14px 10px / 10px 14px 8px 18px;
    box-shadow: 6px 6px 0px 0px #2d2d2d;
    padding: 0; overflow: hidden; aspect-ratio: 16/9; position: relative;
  }

  .tape {
    position: absolute; top: -10px; width: 56px; height: 18px;
    background: rgba(210,205,195,0.6);
    border: 1px dashed rgba(100,90,80,0.25);
    border-radius: 3px; z-index: 5;
  }
  .tape-left { left: 15%; transform: rotate(-3deg); }
  .tape-right { right: 15%; transform: rotate(2deg); }

  .wb-content {
    width: 100%; height: 100%; position: relative;
    background: #fafaf8; overflow: hidden;
  }

  .wb-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(180,175,165,0.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,175,165,0.18) 1px, transparent 1px);
    background-size: 32px 32px; pointer-events: none;
  }

  .wb-sketch { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* HEADLINE */
  .headline-wrap { margin-bottom: 10px; position: relative; }

  h1 {
    font-family: 'Kalam', cursive; font-weight: 700;
    font-size: clamp(30px, 8vw, 60px); line-height: 1.15;
    color: #2d2d2d; position: relative; display: inline-block;
  }

  .headline-accent {
    color: #ff4d4d; position: relative;
    display: inline-block; transform: rotate(-1.5deg);
  }

  .headline-underline {
    display: block; width: 100%; height: 4px;
    background: #ff4d4d; border-radius: 2px; margin-top: -6px;
    transform: rotate(-0.5deg) scaleX(1.04);
    position: relative; left: -2%;
  }

  .sub-headline {
    font-family: 'Patrick Hand', cursive;
    font-size: clamp(14px, 3.5vw, 20px);
    color: #2d2d2d; opacity: 0.75; margin-top: 10px; margin-bottom: 24px;
    line-height: 1.5; max-width: 520px; text-align: center;
    padding: 0 8px;
  }

  /* FORM */
  .form-container {
    width: 100%; max-width: 480px; background: #fff;
    border: 3px solid #2d2d2d;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 6px 6px 0px 0px #2d2d2d;
    padding: 24px 24px 20px; position: relative; transform: rotate(0.4deg);
  }

  .form-label {
    font-family: 'Kalam', cursive; font-weight: 700;
    font-size: clamp(16px, 4vw, 20px);
    color: #2d2d2d; margin-bottom: 12px; display: block; text-align: left;
  }

  .input-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .email-input {
    flex: 1; min-width: 0; height: 48px;
    border: 2.5px solid #2d2d2d;
    border-radius: 225px 15px 255px 15px / 15px 255px 15px 225px;
    background: #ffffff;
    font-family: 'Patrick Hand', cursive;
    font-size: 16px; color: #2d2d2d; padding: 0 16px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: 2px 2px 0px #2d2d2d;
    width: 100%;
  }

  .email-input::placeholder { color: rgba(45,45,45,0.38); }

  .email-input:focus {
    border-color: #2d5da1;
    box-shadow: 2px 2px 0px #2d5da1, 0 0 0 3px rgba(45,93,161,0.12);
  }

  .cta-btn {
    height: 48px; padding: 0 22px; background: #fff;
    border: 3px solid #2d2d2d;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    font-family: 'Patrick Hand', cursive; font-size: 16px; font-weight: 600;
    color: #2d2d2d; cursor: pointer; box-shadow: 4px 4px 0px 0px #2d2d2d;
    transition: all 0.1s; white-space: nowrap; width: 100%;
  }

  .cta-btn:hover {
    background: #ff4d4d; color: #fff;
    box-shadow: 2px 2px 0px 0px #2d2d2d; transform: translate(2px, 2px);
  }

  .cta-btn:active { box-shadow: none; transform: translate(4px, 4px); }

  .free-note {
    font-family: 'Patrick Hand', cursive; font-size: 12px;
    color: rgba(45,45,45,0.5); margin-top: 10px;
    text-align: left; padding-left: 4px;
  }

  .deco-star {
    position: absolute; top: -18px; right: 28px;
    font-family: 'Kalam', cursive; font-size: 22px;
    transform: rotate(12deg);
    animation: bounce 3s ease-in-out infinite;
    color: #ff4d4d; pointer-events: none; user-select: none;
  }

  .deco-arrow {
    position: absolute; right: -38px; bottom: 38px;
    transform: rotate(20deg); opacity: 0.5; pointer-events: none;
  }

  @keyframes bounce {
    0%, 100% { transform: rotate(12deg) translateY(0); }
    50% { transform: rotate(12deg) translateY(-6px); }
  }

  .success-msg {
    display: none; font-family: 'Kalam', cursive; font-size: 18px;
    color: #2d5da1; text-align: center; padding: 10px 0 6px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===================== */
  /*   RESPONSIVE: MOBILE  */
  /* ===================== */

  @media (max-width: 600px) {
    nav { padding: 12px 16px; }
    .logo-icon { width: 36px; height: 36px; }
    .logo-text { font-size: 18px; }
    .nav-tag { font-size: 11px; padding: 3px 8px; }

    .hero { padding: 12px 14px 28px; }

    /* Taller aspect ratio so whiteboard content is readable */
    .whiteboard-outer { aspect-ratio: 4/3; }

    /* Hide tape on mobile — avoids overflow */
    .tape { display: none; }

    /* Reduce tilt on small screens */
    .whiteboard-frame { transform: rotate(-0.5deg); margin-bottom: 22px; }

    h1 { font-size: clamp(28px, 9vw, 42px); }
    .sub-headline { font-size: 15px; margin-bottom: 20px; }

    /* Form: stack vertically */
    .form-container {
      padding: 20px 18px 18px;
      transform: rotate(0.2deg);
      box-shadow: 4px 4px 0px 0px #2d2d2d;
    }

    .input-row { flex-direction: column; gap: 10px; }
    .email-input, .cta-btn { width: 100%; }

    /* Hide desktop deco arrow */
    .deco-arrow { display: none; }
  }

  @media (max-width: 380px) {
    .whiteboard-outer { aspect-ratio: 1/1; }
    h1 { font-size: 26px; }
    .form-label { font-size: 15px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 60 60" fill="none" width="28" height="28">
        <path d="M10 48 C10 48 12 20 18 18 C22 17 28 32 30 36 C32 32 38 17 42 18 C48 20 50 48 50 48" stroke="#2d2d2d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M9 46 Q9.5 20 16 16" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.2"/>

              fill="#ffb3c6" stroke="#2d2d2d" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M41 68 C28 55 20 46 20 37 C20 30 26 25 32 25 C36 25 39 27 41 30 C43 27 46 25 50 25 C56 25 62 30 62 37 C62 46 54 55 41 68 Z"
              fill="#ffd6e3" opacity="0.55"/>

            <circle cx="33" cy="44" r="4.5" fill="#2d2d2d"/>

            <circle cx="51" cy="42" r="1.8" fill="white"/>
            <ellipse cx="26" cy="50" rx="5" ry="3.5" fill="#ff8fab" opacity="0.45"/>

            <path d="M34 55 Q41 62 48 55" stroke="#2d2d2d" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <text x="76" y="22" font-family="Patrick Hand, cursive" font-size="12" fill="#ff4d4d" opacity="0.8">✦</text>
            <text x="2" y="20" font-family="Patrick Hand, cursive" font-size="9" fill="#ffb3c6" opacity="0.9">✦</text>

          <rect x="118" y="20" width="150" height="60" rx="14" stroke="#2d5da1" stroke-width="1.8" stroke-dasharray="5 3" fill="rgba(45,93,161,0.04)"/>

          <text x="193" y="63" font-family="Patrick Hand, cursive" font-size="11" fill="#2d5da1" text-anchor="middle" opacity="0.55">🖊 sketch anything</text>

          <path d="M270 50 Q308 50 308 80" stroke="#2d2d2d" stroke-width="1.5" stroke-linecap="round" fill="none" stroke-dasharray="4 3" opacity="0.4" marker-end="url(#ah)"/>

          <rect x="278" y="80" width="140" height="56" rx="10" stroke="#ff4d4d" stroke-width="2" fill="rgba(255,77,77,0.04)" transform="rotate(-1.5 278 80)"/>
          <text x="348" y="106" font-family="Kalam, cursive" font-size="13" fill="#ff4d4d" text-anchor="middle" opacity="0.9" transform="rotate(-1.5 348 106)">broadcast live</text>
          <text x="348" y="122" font-family="Patrick Hand, cursive" font-size="11" fill="#ff4d4d" text-anchor="middle" opacity="0.55" transform="rotate(-1.5 348 122)">to anyone, anywhere</text>

          <text x="500" y="68" font-family="Patrick Hand, cursive" font-size="11" fill="#2d2d2d" text-anchor="middle" transform="rotate(2.5 500 68)" opacity="0.6">zero lag ⚡</text>

  <div class="headline-wrap">

      The world's <span class="headline-accent">fastest</span><br>
      digital whiteboard.
    </h1>
    <span class="headline-underline"></span>
  </div>

  <p class="sub-headline">
    Built for real-time creation, forever recording and instant broadcast.<br>
    Think it. Draw it. Share it — all at once.
  </p>

  <div class="form-container">
    <div class="deco-star">✦</div>
    <label class="form-label">manifest here ✍️</label>
    <div class="input-row">
      <input class="email-input" type="email" id="emailInput" placeholder="your@email.com" autocomplete="email"/>
      <button class="cta-btn" onclick="handleSubmit()">join waitlist →</button>
    </div>
    <p class="free-note" id="freeNote">first 1,000 users get free access</p>
    <div class="success-msg" id="successMsg">
      ✓ you're on the list! we'll manifest back to you soon ✨
    </div>
    <svg class="deco-arrow" width="38" height="38" viewBox="0 0 38 38" fill="none">
      <path d="M4 8 C4 8 20 4 28 20 C34 30 30 34 26 36" stroke="#2d2d2d" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M20 32 L26 36 L22 28" stroke="#2d2d2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
    </svg>
  </div>

</div>

<script>
async function handleSubmit() {
  const input = document.getElementById('emailInput');
  const val = input.value.trim();
  if (!val || !val.includes('@')) {
    input.style.borderColor = '#ff4d4d';
    input.style.boxShadow = '2px 2px 0px #ff4d4d';
    input.focus();
    setTimeout(() => { input.style.borderColor = ''; input.style.boxShadow = ''; }, 1200);
    return;
  }
  try {
  await fetch('https://script.google.com/macros/s/AKfycbzyTsEGLcGc9vMCbv6END0Mg4g-ExrPqiMa_iBb_v4NPCh8CRiwxqpyuQxs31O-55-y/exec', {
  method: 'POST',
  body: JSON.stringify({ email: val }),
  });
  } catch (e) { /* silent fail */ }

  document.getElementById('freeNote').style.display = 'none';
  document.getElementById('emailInput').style.display = 'none';
  document.querySelector('.cta-btn').style.display = 'none';
  document.getElementById('successMsg').style.display = 'block';
}
document.getElementById('emailInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleSubmit();
});
</script>

</body>
</html>
